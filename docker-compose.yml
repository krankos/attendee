services:
  attendee-app:
    build: .
    image: attendee:isolated-v1
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      DJANGO_SETTINGS_MODULE: attendee.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      SITE_DOMAIN: ${SITE_DOMAIN}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SSL_REQUIRE: ${POSTGRES_SSL_REQUIRE:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_RECORDING_STORAGE_BUCKET_NAME: ${AWS_RECORDING_STORAGE_BUCKET_NAME}
      RECORDING_FILE_PREFIX: ${RECORDING_FILE_PREFIX:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      ENABLE_CHROME_SANDBOX: ${ENABLE_CHROME_SANDBOX:-false}
      DISABLE_EMAIL: ${DISABLE_EMAIL:-true}
      DJANGO_SSL_REQUIRE: ${DJANGO_SSL_REQUIRE:-true}
      LAUNCH_BOT_METHOD: docker-compose-multi-host
    command:
      - gunicorn
      - attendee.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "2"
      - --timeout
      - "120"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  attendee-worker:
    build: .
    image: attendee:isolated-v1
    restart: unless-stopped
    shm_size: "2gb"
    environment:
      DJANGO_SETTINGS_MODULE: attendee.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      SITE_DOMAIN: ${SITE_DOMAIN}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SSL_REQUIRE: ${POSTGRES_SSL_REQUIRE:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_RECORDING_STORAGE_BUCKET_NAME: ${AWS_RECORDING_STORAGE_BUCKET_NAME}
      RECORDING_FILE_PREFIX: ${RECORDING_FILE_PREFIX:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      ENABLE_CHROME_SANDBOX: ${ENABLE_CHROME_SANDBOX:-false}
      DISABLE_EMAIL: ${DISABLE_EMAIL:-true}
      DJANGO_SSL_REQUIRE: ${DJANGO_SSL_REQUIRE:-true}
      LAUNCH_BOT_METHOD: docker-compose-multi-host
    command:
      - celery
      - -A
      - attendee
      - worker
      - -l
      - INFO
      - --concurrency=2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  attendee-scheduler:
    build: .
    image: attendee:isolated-v1
    restart: unless-stopped
    entrypoint: null
    environment:
      DJANGO_SETTINGS_MODULE: attendee.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      SITE_DOMAIN: ${SITE_DOMAIN}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SSL_REQUIRE: ${POSTGRES_SSL_REQUIRE:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_RECORDING_STORAGE_BUCKET_NAME: ${AWS_RECORDING_STORAGE_BUCKET_NAME}
      RECORDING_FILE_PREFIX: ${RECORDING_FILE_PREFIX:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      ENABLE_CHROME_SANDBOX: ${ENABLE_CHROME_SANDBOX:-false}
      DISABLE_EMAIL: ${DISABLE_EMAIL:-true}
      DJANGO_SSL_REQUIRE: ${DJANGO_SSL_REQUIRE:-true}
      LAUNCH_BOT_METHOD: docker-compose-multi-host
    command:
      - python
      - manage.py
      - run_scheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  attendee-launcher:
    extends:
      service: attendee-worker
    restart: unless-stopped
    mem_limit: 512m
    group_add:
      - "${DOCKER_SOCKET_GID:-996}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      BOT_CONTAINER_IMAGE: ${BOT_CONTAINER_IMAGE:-attendee:isolated-v1}
      BOT_CONTAINER_NETWORK: ${BOT_CONTAINER_NETWORK}
      BOT_MAX_SIMULTANEOUS_BOTS: "2"
      BOT_MEMORY_LIMIT: 1280m
      BOT_HOST_MEMORY_HEADROOM: 1g
      BOT_CONTAINER_AUTO_REMOVE: "false"
    command:
      - celery
      - -A
      - attendee
      - worker
      - -l
      - INFO
      - --concurrency=1
      - --queues=bot_launcher_vm
      - --hostname=launcher@%h

  postgres:
    image: postgres:15.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - attendee_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - attendee_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  attendee_postgres_data:
  attendee_redis_data:
